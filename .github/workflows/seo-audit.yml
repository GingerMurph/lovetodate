name: SEO Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI (accessibility + SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Validate sitemap.xml and robots.txt
        run: bun run seo:validate

      - name: Check sitemap is up to date with routes
        run: |
          bun scripts/generate-sitemap.ts
          if ! git diff --quiet -- public/sitemap.xml; then
            echo "::error::public/sitemap.xml is out of date. Run 'bun scripts/generate-sitemap.ts' and commit the result."
            git --no-pager diff -- public/sitemap.xml
            exit 1
          fi

      - name: Run Lighthouse CI
        id: lhci
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: .lighthouseci
          retention-days: 30

      - name: Summarize
        if: always()
        run: |
          {
            echo "## SEO & accessibility audit"
            echo ""
            echo "[Full run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            if ls .lighthouseci/*.json >/dev/null 2>&1; then
              echo '### Category scores'
              echo '| URL | Accessibility | SEO |'
              echo '| --- | --- | --- |'
              for f in .lighthouseci/lhr-*.json; do
                jq -r '"| \(.finalUrl) | \((.categories.accessibility.score * 100) | floor) | \((.categories.seo.score * 100) | floor) |"' "$f"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
